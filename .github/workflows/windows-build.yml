name: Windows app build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "shared/**"
      - "desktop/**"
      - "tests/**"
      - "package*.json"
      - "index.html"
      - "vite.config.mts"
      - "tsconfig.json"
      - ".github/workflows/windows-build.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify data workflows
        run: npm test
      - name: Verify desktop workflows
        run: npm run test:desktop
      - name: Build Windows installer and portable executable
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Calculate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: park-workdesk-windows-${{ github.run_number }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
